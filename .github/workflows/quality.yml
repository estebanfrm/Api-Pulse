name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# No job needs to write to the repository; checkout only reads.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app tests ../tests/integration

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check app tests ../tests/integration

  python-audit:
    name: Python audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the runtime requirements only; pip-audit resolves the transitive tree,
      # which is where a pinned direct dependency can hold back a patched one. It runs
      # in its own job so installing the auditor cannot change what the tests resolve.
      - name: Audit runtime dependencies
        run: pip-audit -r backend/requirements.txt

  postgres-smoke:
    name: PostgreSQL smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: api_pulse
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: api_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_pulse -d api_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://api_pulse:ci_test_only@localhost:5432/api_pulse
      PUBLIC_DEMO: "true"
      TEST_POSTGRES_SMOKE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke test public demo and persistence
        run: pytest tests/test_postgres_smoke.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --omit=optional

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

      - name: Validate integration compose config
        run: docker compose -p api-pulse-t03 -f compose.integration.yml config --quiet

      # config only checks syntax. Loading vite.config.js inside the image catches a
      # file the Dockerfile forgot to copy, which otherwise only shows up when the
      # container starts and exits.
      - name: Build the development frontend image and load its Vite config
        run: |
          docker compose build frontend
          docker compose run --rm --no-deps frontend npx vite build
