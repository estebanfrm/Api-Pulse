services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api_pulse
      POSTGRES_PASSWORD: api_pulse_integration
      POSTGRES_DB: api_pulse
    volumes:
      - t03_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${T03_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_pulse -d api_pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  controlled-target:
    build:
      context: ./backend
    command: ["python", "/integration/controlled_target.py"]
    volumes:
      - ./tests/integration/controlled_target.py:/integration/controlled_target.py:ro
    networks:
      test-egress:
        ipv4_address: 8.8.8.8
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://api_pulse:api_pulse_integration@postgres:5432/api_pulse
      FRONTEND_ORIGIN: http://127.0.0.1:${T03_FRONTEND_PORT:-15173}
      REQUEST_TIMEOUT_SECONDS: 5
      PUBLIC_DEMO: "false"
    extra_hosts:
      - "controlled-target.test:8.8.8.8"
    ports:
      - "127.0.0.1:${T03_BACKEND_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      controlled-target:
        condition: service_healthy
    networks:
      - default
      - test-egress
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${T03_BACKEND_PORT:-18000}
      VITE_PUBLIC_DEMO: "false"
    ports:
      - "127.0.0.1:${T03_FRONTEND_PORT:-15173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  t03_postgres_data:

networks:
  test-egress:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 8.8.8.0/24
